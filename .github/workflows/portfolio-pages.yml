name: Publier le portfolio sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portfolio-creative-adrien/package-lock.json
      - name: Compiler le nouveau portfolio
        working-directory: portfolio-creative-adrien
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build -- --base="${PAGES_BASE%/}/"
      - name: Inclure la version précédente
        run: |
          archive=portfolio-creative-adrien/dist/ancien
          mkdir -p "$archive"
          cp -R index.html contact.html parcours.html projets.html favicon.svg assets documents "$archive/"
      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: portfolio-creative-adrien/dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
